# Checks every change to dev and main: OpenECS's dev is checked out with its submodules, this repository's commit is put in its examples/ folder,
# and the examples are built and their tests run. The examples are the tests of OpenECS and its standard plugins.
name: Checks

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-linux:
    name: Debug (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: omerfuyar/OpenECS
          ref: dev
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          path: examples

      - name: Install the build tools
        run: .github/scripts/install-linux.sh

      # OpenECS's dependencies are built only when their library is missing, so they are kept until a submodule or OpenECS's build changes
      - name: Name the dependencies' versions
        id: dependencies
        run: echo "key=$( (git submodule status --recursive dependencies; sha256sum shuild.c dependencies/other/*/*) | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the built dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/Debug/lib
            build/Debug/include
          key: debug-linux-${{ steps.dependencies.outputs.key }}

      - name: Build with the examples
        run: .github/scripts/build.sh D

      - name: Run the examples' tests with the sanitizers
        run: .github/scripts/test.sh build/Debug/bin/OpenECS

      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-linux-logs
          path: build/*.log

  lua:
    name: Lua (LuaLS)
    runs-on: ubuntu-24.04
    env:
      LUALS_VERSION: 3.15.0
    steps:
      - uses: actions/checkout@v4
        with:
          repository: omerfuyar/OpenECS
          ref: dev
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          path: examples

      - name: Install the Lua language server
        run: |
          mkdir -p "$RUNNER_TEMP/luals"
          curl -sSL "https://github.com/LuaLS/lua-language-server/releases/download/$LUALS_VERSION/lua-language-server-$LUALS_VERSION-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP/luals"

      # the check reads OpenECS's ecs.lua as a library, so it finds code that misuses the ecs module
      - name: Check the Lua files
        run: |
          echo '{ "workspace.library": ["../include"] }' > examples/.luarc.json
          "$RUNNER_TEMP/luals/bin/lua-language-server" --check="$GITHUB_WORKSPACE/examples" --checklevel=Warning --logpath="$RUNNER_TEMP/luals-log" | tee luals.log
          grep -q "no problems found" luals.log
